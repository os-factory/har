version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /control
      - /packages/schemas
      - /docs
    schedule:
      interval: daily
    # chore(deps): … — no release on its own (see AGENTS.md); retitle to
    # fix(deps): when a runtime dependency fix should ship.
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
