name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Analyze commits and print the next release without publishing
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/schemas/package-lock.json
            control/package-lock.json

      - name: Install and verify CLI
        run: |
          npm ci
          npm run build
          node dist/index.js env launch 1
          node dist/index.js env verify 1 --full

      - name: Install Mission Control dependencies
        run: |
          npm ci --prefix packages/schemas
          npm ci --prefix control

      # The control harness's .har/*.sh are thin shims that resolve `har` from
      # PATH (#235). Without this repo's runtime on PATH they fall through to
      # `npx @osfactory/har@<pinned>` — the last *published* release, which
      # predates #234, re-executes the shim, and trips the #291 loop guard
      # (exit 86, #298). The CLI step above already built dist/.
      - name: Put the har runtime under test on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/har-bin"
          printf '#!/usr/bin/env bash\nexec node "%s/dist/index.js" "$@"\n' \
            "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/har-bin/har"
          chmod +x "$RUNNER_TEMP/har-bin/har"
          echo "$RUNNER_TEMP/har-bin" >> "$GITHUB_PATH"

      - name: Get Playwright version
        id: playwright-version
        working-directory: control
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: control
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: control
        run: npx playwright install-deps chromium

      - name: Launch Mission Control harness
        working-directory: control
        run: ./.har/launch.sh 1 --no-worktree

      - name: Verify Mission Control (full)
        working-directory: control
        env:
          CI: true
        run: ./.har/verify.sh 1 --full

      - name: Teardown Mission Control harness
        if: always()
        working-directory: control
        run: ./.har/teardown.sh 1

  release:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    environment: npm-publish

    # Default GITHUB_TOKEN permissions only. GitHub App token permissions are requested below.
    permissions:
      contents: read
      id-token: write

    outputs:
      released: ${{ steps.detect.outputs.released }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}

    steps:
      - name: Create release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # Client ID: repo/org variable (vars.RELEASE_HAR_CLI_APP_CLIENT_ID) or
          # npm-publish environment secret (secrets.RELEASE_HAR_CLI_APP_CLIENT_ID).
          client-id: ${{ vars.RELEASE_HAR_CLI_APP_CLIENT_ID || secrets.RELEASE_HAR_CLI_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_HAR_CLI_APP_PRIVATE_KEY }}
          # Must match permissions granted on the release-har-cli app installation.
          # Contents write is required for @semantic-release/git and GitHub releases.
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Configure git as GitHub App bot
        run: |
          USER_ID="$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)"
          git config --global user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config --global user.email "${USER_ID}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Record latest tag before release
        id: before
        run: |
          TAG="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Semantic release (version cut + GitHub; npm deferred until Docker)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi

      - name: Detect published release
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force
          TAG="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          BEFORE="${{ steps.before.outputs.tag }}"

          if [ -n "$TAG" ] && [ "$TAG" != "$BEFORE" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "Published $TAG (version cut + GitHub Release; Docker then npm follow)"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No new release — skipped version cut and downstream publish jobs"
          fi

  # Native amd64 + arm64 builds in parallel (see publish-docker.yml). Skips
  # rebuild when the exact version tag already exists (e.g. re-run after npm failed).
  publish-docker:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/publish-docker.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # Publish to npm only after Docker Hub has the matching version (avoids CLI
  # pointing users at har control up for a tag that does not exist on Docker Hub).
  publish-npm:
    needs: [release, publish-docker]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install and publish @osfactory/har
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          EXPECTED="${{ needs.release.outputs.version }}"
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "package.json version ($ACTUAL) does not match tag v${EXPECTED}" >&2
            exit 1
          fi
          npm ci
          npm publish --access public
          echo "Published @osfactory/har@${EXPECTED} to npm after Docker Hub push"
