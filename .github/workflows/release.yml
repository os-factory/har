name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Analyze commits and print the next release without publishing
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: theosfactory
  CONTROL_IMAGE: theosfactory/har-control

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install and verify CLI
        run: |
          npm ci
          npm run build
          node dist/index.js env launch 1
          node dist/index.js env verify 1 --full

      - name: Verify Mission Control
        run: |
          npm ci --prefix packages/schemas
          npm ci --prefix control
          npm run typecheck --prefix control
          npm test --prefix control

  release:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    environment: npm-publish

    # Default GITHUB_TOKEN permissions only. GitHub App token permissions are requested below.
    permissions:
      contents: read
      id-token: write

    outputs:
      released: ${{ steps.detect.outputs.released }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}

    steps:
      - name: Create release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # Client ID: repo/org variable (vars.RELEASE_HAR_CLI_APP_CLIENT_ID) or
          # npm-publish environment secret (secrets.RELEASE_HAR_CLI_APP_CLIENT_ID).
          client-id: ${{ vars.RELEASE_HAR_CLI_APP_CLIENT_ID || secrets.RELEASE_HAR_CLI_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_HAR_CLI_APP_PRIVATE_KEY }}
          # Must match permissions granted on the release-har-cli app installation.
          # Contents write is required for @semantic-release/git and GitHub releases.
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Configure git as GitHub App bot
        run: |
          USER_ID="$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)"
          git config --global user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config --global user.email "${USER_ID}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Record latest tag before release
        id: before
        run: |
          TAG="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Semantic release (npm + GitHub tag/release)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi

      - name: Detect published release
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force
          TAG="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          BEFORE="${{ steps.before.outputs.tag }}"

          if [ -n "$TAG" ] && [ "$TAG" != "$BEFORE" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "Published $TAG (npm, GitHub Release, Docker follow in publish-docker job)"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No new release — skipped npm publish and downstream jobs"
          fi

  publish-docker:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Validate tag matches package.json
        run: |
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          CONTROL_VERSION="$(node -p "require('./control/package.json').version")"
          SCHEMAS_VERSION="$(node -p "require('./packages/schemas/package.json').version")"
          EXPECTED="${{ needs.release.outputs.version }}"
          for label_version in \
            "package.json:${ROOT_VERSION}" \
            "control/package.json:${CONTROL_VERSION}" \
            "packages/schemas/package.json:${SCHEMAS_VERSION}"; do
            FILE="${label_version%%:*}"
            ACTUAL="${label_version#*:}"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "$FILE version ($ACTUAL) does not match tag (${{ needs.release.outputs.tag }})" >&2
              exit 1
            fi
          done

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: docker_meta
        with:
          images: ${{ env.CONTROL_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: control/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
