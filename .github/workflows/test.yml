name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: node dist/index.js env launch 1
      - run: node dist/index.js env verify 1 --full

  control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: control/package-lock.json
      # @har/schemas path alias typechecks source files — zod must exist under packages/schemas/
      - run: npm ci --prefix packages/schemas
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
