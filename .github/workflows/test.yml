name: Verify

on:
  pull_request:
    branches:
      - main

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      control: ${{ steps.filter.outputs.control }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'src/**'
              - 'tests/**'
              - 'packages/schemas/**'
              - 'scripts/**'
              - '.har/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'jest.config.*'
              - '.eslintrc*'
              - 'eslint.config.*'
              - '.github/workflows/test.yml'
            control:
              - 'control/**'
              - 'packages/schemas/**'
              - '.github/workflows/test.yml'

  test:
    name: CLI harness
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: node dist/index.js env launch 1
      - run: node dist/index.js env verify 1 --full

  control:
    name: Mission Control
    needs: changes
    if: needs.changes.outputs.control == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            control/package-lock.json
            packages/schemas/package-lock.json

      # @har/schemas path alias typechecks source files — zod must exist under packages/schemas/
      - name: Install dependencies
        run: |
          npm ci --prefix packages/schemas
          npm ci --prefix control

      # #314: CLI/MCP are the only entry points. Put THIS repo's runtime on
      # PATH so the job dogfoods `har env …` against the code under test
      # instead of `npx @osfactory/har@<pinned>`.
      - name: Build the har runtime under test
        run: |
          npm ci
          npm run build

      - name: Put the har runtime under test on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/har-bin"
          printf '#!/usr/bin/env bash\nexec node "%s/dist/index.js" "$@"\n' \
            "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/har-bin/har"
          chmod +x "$RUNNER_TEMP/har-bin/har"
          echo "$RUNNER_TEMP/har-bin" >> "$GITHUB_PATH"

      - name: Get Playwright version
        id: playwright-version
        working-directory: control
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: control
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: control
        run: npx playwright install-deps chromium

      # Dogfood control/.har (same path agents use locally). --no-worktree: the
      # Actions checkout is already the code under test.
      - name: Launch Mission Control harness
        working-directory: control
        run: har env launch 1 --no-worktree

      # Full verify includes docker-build: image build + smoke-boot (prisma db push
      # and /api/health). Build-only checks miss first-boot CLI/runtime regressions.
      - name: Verify Mission Control (full)
        working-directory: control
        env:
          CI: true
        run: har env verify 1 --full

      # The verify log only carries the stage summary; the Playwright report and
      # per-test traces/screenshots are what you need to see why browser-e2e failed.
      - name: Upload browser-e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mission-control-browser-e2e
          path: |
            control/.har/artifacts/browser-e2e/playwright-report
            control/.har/artifacts/browser-e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Teardown Mission Control harness
        if: always()
        working-directory: control
        run: har env teardown 1
