# Secrets scanning with the official Gitleaks action.
# Installed by `har env add-plugin gitleaks --with-ci` (CI files are skipped by default).
#
# This CI run is what produces org-level scanning evidence that compliance
# platforms (Vanta, Drata, …) can ingest via your GitHub organization.
# Local .har stage runs are pre-merge protection only.
#
# GITLEAKS_LICENSE is required for organization repos (free — see
# https://github.com/gitleaks/gitleaks-action#environment-variables);
# personal accounts can omit it.
name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
