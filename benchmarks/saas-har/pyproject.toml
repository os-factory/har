[project]
name = "saas-har-benchmark"
version = "0.1.0"
description = "Paired web-SaaS / backend-API benchmark: Claude Code raw vs Claude Code + HAR (NewtypeBench/PrototypeBench + SWE-bench Multimodal)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0.0",
  "pyyaml>=6.0",
  "swebench>=4.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
pythonpath = ["scripts"]
